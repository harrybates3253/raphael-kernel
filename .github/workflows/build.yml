name: Build raphael Droidspaces+KSU kernel

# 用法（手机浏览器就能走完）:
#   1. GitHub 上新建仓库 -> 把本 kit 推上去（或直接在网页上传）
#   2. 仓库 Actions 页 -> 左侧 "Build raphael Droidspaces+KSU kernel" -> Run workflow -> Run
#   3. 约 25~40 分钟；完成后两种拿法：
#      - Releases 里直接下 zip（推荐，手机可直接下载来刷）
#      - Actions 运行页底部 Artifacts
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "内核源码 repo"
        default: "https://github.com/Laulan56/android_kernel_xiaomi_sm8150.git"
      branch:
        description: "分支"
        default: "android14"
      defconfig:
        description: "基础 defconfig"
        default: "raphael_stock_defconfig"
      ksu_tag:
        description: "KernelSU tag/commit（master = backslashxx 分支最新）"
        default: "master"
      defconfig_file:
        description: "外部 config 文件（仓库内路径，优先于 defconfig；留空不用）"
        default: ""
      mandisa:
        description: "下载并使用 Mandisa clang（酷安配方）"
        type: boolean
        default: false
      target:
        description: "编译目标（默认 Image；高通内置 DTB 用 Image.gz-dtb）"
        default: "Image"
      localversion:
        description: "CONFIG_LOCALVERSION（对齐厂商模块 vermagic，例如 -Rikka-V6-20241003-2344）"
        default: ""
      no_modversions:
        description: "关闭 CONFIG_MODVERSIONS（跨编译器 CRC 不可能一致）"
        type: boolean
        default: true
      no_media:
        description: "关掉 camera/vidc（image_size 瘦身）"
        type: boolean
        default: false
      aosp_clang:
        description: "强制用 AOSP clang（而不是 runner 自带的 clang 18）"
        type: boolean
        default: true
      ias:
        description: "用 clang 集成汇编器 (-fintegrated-as)"
        type: boolean
        default: false
      tiny:
        description: "体积最小化：KCFLAGS 追加 -Oz / -fno-unwind-tables"
        type: boolean
        default: false
      baseline:
        description: "只量体积：用 defconfig_file 当基线、不叠加 fragment"
        type: boolean
        default: false
      slim:
        description: "体积急救：关调试基础设施（FTRACE/DEBUG_KERNEL/LOCKDEP…）"
        type: boolean
        default: false
      use_lld:
        description: "用 LLD 链接（和 Rikka 的构建方式一致，通常更小）"
        type: boolean
        default: true
      drop_techpack:
        description: "砍掉 techpack（camera/audio，Image 里能占 15MB）"
        type: boolean
        default: false
      no_ksu:
        description: "只编 Droidspaces（不要 KernelSU，用于排查启动失败）"
        type: boolean
        default: false
      clang:
        description: "clang 版本（4.14 老树编不过时换它）"
        default: "clang-r416183b1"
        type: choice
        options:
          - clang-r416183b1
          - clang-r450784d
          - clang-r487747c
      tag:
        description: "产物 release 标签（留空自动用时间戳）"
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      WORK: ${{ github.workspace }}/work
    steps:
      - name: Checkout kit
        uses: actions/checkout@v4

      - name: Runner info
        run: |
          uname -a; nproc; df -h / | tail -1; python3 --version; git --version

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: Install deps
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev lz4 cpio python3 curl \
            unzip zip patch git p7zip-full libyaml-dev device-tree-compiler gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu lld llvm
          # armel 交叉 gcc 不是必须（只有 vdso32 才会用到），装不上不算失败
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabi \
            || echo "::warning::gcc-arm-linux-gnueabi 装不上，CROSS_COMPILE_ARM32 会跳过"
          aarch64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-ld --version | head -1
          df -h / | tail -1

      - name: Download Mandisa clang (optional)
        if: ${{ inputs.mandisa }}
        run: |
          set -e
          URL="https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-24/llvm24.0.0-binutils2.46.1_amd64-kernel-arm_static-20260823.7z"
          curl -sSL --retry 5 --retry-all-errors -o mandisa.7z "$URL"
          7z x -y mandisa.7z -o"$RUNNER_TEMP/mandisa" >/dev/null
          find "$RUNNER_TEMP/mandisa" -maxdepth 3 -name clang -type f | head -3
          CDIR=$(dirname "$(find "$RUNNER_TEMP/mandisa" -maxdepth 3 -name clang -type f | head -1)")
          echo "CLANG_DIR=$CDIR" >> $GITHUB_ENV
          "$CDIR/clang" --version | head -2

      - name: Configure + config gate (--check)
        env:
          CLANG_VER: ${{ inputs.clang }}
        run: |
          chmod +x build.sh verify.sh flash-backup.sh
          ./build.sh --check \
            --repo "${{ inputs.repo }}" --branch "${{ inputs.branch }}" \
            --defconfig "${{ inputs.defconfig }}" --ksu-tag "${{ inputs.ksu_tag }}" \
            ${{ inputs.no_ksu && '--no-ksu' || '' }} \
            ${{ inputs.drop_techpack && '--drop-techpack' || '' }} \
            ${{ inputs.use_lld && '--lld' || '' }} \
            ${{ inputs.slim && '--slim' || '' }} \
            ${{ inputs.baseline && '--baseline' || '' }} \
            ${{ inputs.tiny && '--tiny' || '' }} \
            ${{ inputs.aosp_clang && '--aosp-clang' || '' }} \
            ${{ inputs.no_media && '--no-media' || '' }} \
            ${{ inputs.localversion != '' && format('--localversion {0}', inputs.localversion) || '' }} \
            ${{ inputs.target != 'Image' && format('--target {0} --kernel-blob {0}', inputs.target) || '' }} \
            ${{ inputs.mandisa && '--clang-dir "$CLANG_DIR"' || '' }} \
            ${{ inputs.no_modversions && '--no-modversions' || '' }} \
            ${{ inputs.ias && '--ias' || '' }} \
            ${{ inputs.defconfig_file != '' && format('--defconfig-file {0}', inputs.defconfig_file) || '' }}
          ./verify.sh --tree "work/${{ inputs.branch }}" --defconfig "${{ inputs.defconfig }}"

      - name: Build Image + AnyKernel3 zip
        env:
          CLANG_VER: ${{ inputs.clang }}
        run: |
          ./build.sh \
            --repo "${{ inputs.repo }}" --branch "${{ inputs.branch }}" \
            --defconfig "${{ inputs.defconfig }}" --ksu-tag "${{ inputs.ksu_tag }}" \
            ${{ inputs.no_ksu && '--no-ksu' || '' }} \
            ${{ inputs.drop_techpack && '--drop-techpack' || '' }} \
            ${{ inputs.use_lld && '--lld' || '' }} \
            ${{ inputs.slim && '--slim' || '' }} \
            ${{ inputs.baseline && '--baseline' || '' }} \
            ${{ inputs.tiny && '--tiny' || '' }} \
            ${{ inputs.aosp_clang && '--aosp-clang' || '' }} \
            ${{ inputs.no_media && '--no-media' || '' }} \
            ${{ inputs.localversion != '' && format('--localversion {0}', inputs.localversion) || '' }} \
            ${{ inputs.target != 'Image' && format('--target {0} --kernel-blob {0}', inputs.target) || '' }} \
            ${{ inputs.mandisa && '--clang-dir "$CLANG_DIR"' || '' }} \
            ${{ inputs.no_modversions && '--no-modversions' || '' }} \
            ${{ inputs.ias && '--ias' || '' }} \
            ${{ inputs.defconfig_file != '' && format('--defconfig-file {0}', inputs.defconfig_file) || '' }} \
            -j "$(nproc)"

      - name: Dump build log on failure
        if: failure()
        run: |
          for f in work/build.log work/merge.log work/ksu-smoke.log work/defconfig.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            echo "---- error lines ----"
            grep -nE "error:|Error [0-9]|\*\*\*|undefined reference|No rule|MISSING|not found" "$f" | tail -60 || true
            echo "---- tail 150 ----"
            tail -150 "$f" || true
            echo "::endgroup::"
          done

      - name: Show result
        run: |
          ls -lh *.zip Image-* .config-* 2>/dev/null || true
          cat *.zip.sha256 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raphael-droidspaces-ksu
          path: |
            *.zip
            *.zip.sha256
            Image-*
            .config-*
            work/build.log
            work/merge.log
          if-no-files-found: warn

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="raphael-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" \
            --title "$TAG  (raphael / droidspaces + ksu)" \
            --notes "repo: ${{ inputs.repo }}
          branch: ${{ inputs.branch }}
          defconfig: ${{ inputs.defconfig }}
          ksu: ${{ inputs.ksu_tag }}
          刷前先备份 boot: adb shell \"su -c 'dd if=/dev/block/bootdevice/by-name/boot of=/sdcard/boot-backup.img'\"" \
            *.zip *.zip.sha256 Image-* .config-* || true
